apiVersion: apps/v1
kind: Deployment

metadata:
  name: vprofile

spec:
  replicas: 2

  selector:
    matchLabels:
      app: vprofile

  template:
    metadata:
      labels:
        app: vprofile

    spec:
      initContainers:
        - name: init-mydb
          image: busybox:1.28
          command: ["sh", "-c"]
          args:
            - >-
              until nslookup
              db01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local;
              do echo waiting for vprodb; sleep 2; done

        - name: init-memcache
          image: busybox:1.28
          command: ["sh", "-c"]
          args:
            - >-
              until nslookup
              mc01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local;
              do echo waiting for vprocache01; sleep 2; done

        - name: init-rabbitmq
          image: busybox:1.28
          command: ["sh", "-c"]
          args:
            - >-
              until nslookup
              rmq01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local;
              do echo waiting for vpromq01; sleep 2; done

      containers:
        - name: vprofile
          image: 776648109966.dkr.ecr.us-east-1.amazonaws.com/vprofile-app-img-new
          ports:
            - containerPort: 8080

          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: db-user

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: db-pass

            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: rmq-user

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: rmq-pass

            - name: APP_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: app-admin-user

            - name: APP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: app-admin-pass